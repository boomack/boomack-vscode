title: Standard

defs:
  footSlot: &footSlot
    border: false
    row: 4
    rowSpan: 2
    history: 0
    zoom: 0.75

theme: dark
type: grid
grid:
  columns: 2
  rows: 6
defaultSlot: main
slots:
  title:
    toolbar: false
    border: false
    columnSpan: 2
  main:
    row: 1
    columnSpan: 2
    rowSpan: 3
    history: 10
  left:
    <<: *footSlot
    column: 0
  right:
    <<: *footSlot
    column: 1
